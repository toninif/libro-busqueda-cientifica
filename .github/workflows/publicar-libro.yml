# Renderiza el libro con Quarto y lo publica en la rama gh-pages
# cada vez que cambia la rama main. También puede ejecutarse a mano
# desde la pestaña Actions del repositorio.
name: Publicar el libro

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      # Solo la versión web: la de Word necesita un navegador para
      # convertir los diagramas en imágenes y se genera localmente.
      - name: Renderizar la versión web
        run: quarto render --to html

      - name: Publicar en gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
